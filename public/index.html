<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web Proxy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #111827;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; }
    p { color: #6b7280; }
    form { display: flex; gap: 10px; margin-top: 22px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 16px;
      cursor: pointer;
      background: #111827;
      color: white;
    }
    button:disabled { opacity: .6; }
    #status { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Web Proxy</h1>
    <p>URLを入力してWebページを開く。</p>
    <form id="form">
      <input id="url" type="url" placeholder="https://example.com" required>
      <button>開く</button>
    </form>
    <div id="status"></div>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#url");
    const status = document.querySelector("#status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!/^https?:\/\//i.test(value)) {
        status.textContent = "http:// または https:// から入力してね";
        return;
      }
      status.textContent = "読み込み中…";
      location.href = "/proxy?url=" + encodeURIComponent(value);
    });
  </script>
</body>
</html>
